name: dns

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Un cambio a la vez: dos merges seguidos no se pisan el estado.
concurrency:
  group: dns
  cancel-in-progress: false

permissions:
  contents: read

env:
  WIF_PROVIDER: projects/${{ vars.PROYECTO_NUMERO }}/locations/global/workloadIdentityPools/github/providers/github

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Validar zonas
        run: pip install --quiet pyyaml && python3 scripts/validar.py
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: dns-plan@linkhub-dns.iam.gserviceaccount.com
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform fmt -check && terraform init -input=false && terraform validate
      # El plan de un PR no bloquea el estado: dns-plan solo puede leerlo.
      - name: Plan
        run: |
          terraform plan -input=false -no-color -lock=false -out=tfplan > plan.txt 2>&1 || { cat plan.txt; exit 1; }
          cat plan.txt
      - name: Comentar el plan en el PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('plan.txt', 'utf8');
            const i = plan.indexOf('Terraform will perform');
            if (i >= 0) plan = plan.slice(i);
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n...(recortado)';
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              body: '### Plan de DNS\n```\n' + plan + '\n```\nAl hacer merge a `main` se aplica tal cual.'
            });

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Validar zonas
        run: pip install --quiet pyyaml && python3 scripts/validar.py
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: dns-apply@linkhub-dns.iam.gserviceaccount.com
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -input=false
      - run: terraform apply -input=false -auto-approve
