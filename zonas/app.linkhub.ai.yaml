# Registros de la zona app.linkhub.ai (Cloud DNS, proyecto linkhub-dns, zona app-linkhub-ai).
#
# Cada entrada:
#   nombre:  la parte a la izquierda de app.linkhub.ai ("crm-dev" -> crm-dev.app.linkhub.ai)
#   tipo:    A, AAAA, CNAME, TXT, NS, CAA o MX
#   ttl:     segundos (300 a 86400)
#   valores: lista de valores (CNAME y NS terminan en punto)
#   dueno:   equipo o persona responsable (obligatorio)
#   nota:    para qué es (obligatorio)
#
# Se añade o cambia por pull request: el CI valida y muestra el plan; al hacer merge a main
# se aplica solo. Ver README.md.

registros:
  # CRM de NOA (entorno dev). La subzona vive en el proyecto lhcrm-dev: dentro, el equipo
  # del CRM gestiona admin., api. y <organizacion>. sin pasar por este repo.
  - nombre: crm-dev
    tipo: NS
    ttl: 3600
    valores:
      - ns-cloud-d1.googledomains.com.
      - ns-cloud-d2.googledomains.com.
      - ns-cloud-d3.googledomains.com.
      - ns-cloud-d4.googledomains.com.
    dueno: equipo-crm
    nota: Subzona crm-dev del CRM de NOA (zona crm-dev en lhcrm-dev, creada por infra/gcp/dominio.sh)

  # Correo transaccional del CRM (Brevo, remitente no-reply@crm.app.linkhub.ai: invitaciones y
  # restablecer contraseña). Cuando exista la subzona de producción "crm", mover estos 4 allí.
  - nombre: crm
    tipo: TXT
    ttl: 3600
    valores: ["brevo-code:d833088a98d95d0c3aa6faacb0f77bd0"]
    dueno: equipo-crm
    nota: Verificación del dominio de envío en Brevo
  - nombre: brevo1._domainkey.crm
    tipo: CNAME
    ttl: 3600
    valores: [b1.crm-app-linkhub-ai.dkim.brevo.com.]
    dueno: equipo-crm
    nota: DKIM 1 de Brevo (firma de los correos del CRM)
  - nombre: brevo2._domainkey.crm
    tipo: CNAME
    ttl: 3600
    valores: [b2.crm-app-linkhub-ai.dkim.brevo.com.]
    dueno: equipo-crm
    nota: DKIM 2 de Brevo (firma de los correos del CRM)
  - nombre: _dmarc.crm
    tipo: TXT
    ttl: 3600
    valores: ["v=DMARC1; p=none; rua=mailto:rua@dmarc.brevo.com"]
    dueno: equipo-crm
    nota: DMARC del dominio de envío del CRM
